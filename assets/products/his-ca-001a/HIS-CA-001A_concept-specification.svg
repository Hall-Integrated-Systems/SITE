<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HIS-CA-001A concept specification drawing</title>
  <desc id="desc">Pre-CAD, not-to-scale concept specification for a four-wire speaker cable comb with planning targets of 60 by 16 by 12 millimeters, PETG material, and support for 14 to 16 AWG speaker wire.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#182430"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6ca0dc" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#35b7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="619" rx="12" fill="none" stroke="#c8d0d8" stroke-opacity="0.34"/>

  <text x="64" y="86" fill="#35b7ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">HALL INTEGRATED SYSTEMS</text>
  <text x="64" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">HIS-CA-001A Concept Specification</text>
  <text x="64" y="164" fill="#c8d0d8" font-family="Arial, Helvetica, sans-serif" font-size="17">4-Wire Speaker Cable Comb · REV-A planning reference</text>

  <rect x="848" y="68" width="278" height="82" rx="8" fill="#102b46" stroke="#35b7ff" stroke-opacity="0.72"/>
  <text x="987" y="99" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">CONCEPT / PRE-CAD</text>
  <text x="987" y="127" fill="#8fd6ff" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">NOT TO SCALE</text>

  <g aria-label="Top-view concept diagram">
    <text x="72" y="223" fill="#8fd6ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TOP-VIEW CONCEPT</text>
    <rect x="110" y="274" width="570" height="152" rx="24" fill="#172b3c" stroke="#dce6ee" stroke-width="3"/>

    <g fill="#071426" stroke="#35b7ff" stroke-width="3">
      <path d="M 170 274 v 44 a 22 22 0 0 0 44 0 v -44 z"/>
      <path d="M 270 274 v 44 a 22 22 0 0 0 44 0 v -44 z"/>
      <path d="M 470 274 v 44 a 22 22 0 0 0 44 0 v -44 z"/>
      <path d="M 570 274 v 44 a 22 22 0 0 0 44 0 v -44 z"/>
    </g>

    <circle cx="392" cy="350" r="20" fill="#071426" stroke="#dce6ee" stroke-width="3"/>
    <circle cx="392" cy="350" r="8" fill="#35b7ff" fill-opacity="0.35" stroke="#35b7ff" stroke-width="2"/>
    <rect x="210" y="376" width="78" height="14" rx="7" fill="#071426" stroke="#dce6ee" stroke-width="2"/>
    <rect x="496" y="376" width="78" height="14" rx="7" fill="#071426" stroke="#dce6ee" stroke-width="2"/>

    <line x1="110" y1="466" x2="680" y2="466" stroke="#35b7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="110" y1="438" x2="110" y2="480" stroke="#35b7ff" stroke-width="2"/>
    <line x1="680" y1="438" x2="680" y2="480" stroke="#35b7ff" stroke-width="2"/>
    <text x="395" y="498" fill="#8fd6ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">60 mm TARGET LENGTH</text>

    <line x1="76" y1="274" x2="76" y2="426" stroke="#35b7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="64" y1="274" x2="98" y2="274" stroke="#35b7ff" stroke-width="2"/>
    <line x1="64" y1="426" x2="98" y2="426" stroke="#35b7ff" stroke-width="2"/>
    <text x="52" y="355" fill="#8fd6ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 52 355)">16 mm TARGET WIDTH</text>
  </g>

  <g aria-label="Concept callouts" font-family="Arial, Helvetica, sans-serif">
    <text x="760" y="222" fill="#8fd6ff" font-size="15" font-weight="700" letter-spacing="2">PLANNING TARGETS</text>
    <line x1="610" y1="302" x2="740" y2="268" stroke="#35b7ff" stroke-width="2"/>
    <circle cx="610" cy="302" r="5" fill="#35b7ff"/>
    <text x="760" y="268" fill="#ffffff" font-size="19" font-weight="700">Four open wire channels</text>
    <text x="760" y="294" fill="#c8d0d8" font-size="16">Target compatibility: 14–16 AWG speaker wire</text>

    <line x1="412" y1="350" x2="740" y2="350" stroke="#35b7ff" stroke-width="2"/>
    <circle cx="412" cy="350" r="5" fill="#35b7ff"/>
    <text x="760" y="350" fill="#ffffff" font-size="19" font-weight="700">Center screw-mount concept</text>
    <text x="760" y="376" fill="#c8d0d8" font-size="16">Countersunk direction pending CAD validation</text>

    <line x1="574" y1="383" x2="740" y2="432" stroke="#35b7ff" stroke-width="2"/>
    <circle cx="574" cy="383" r="5" fill="#35b7ff"/>
    <text x="760" y="432" fill="#ffffff" font-size="19" font-weight="700">Secondary retention concepts</text>
    <text x="760" y="458" fill="#c8d0d8" font-size="16">Two zip-tie slots shown for development review</text>
  </g>

  <rect x="64" y="538" width="1072" height="78" rx="8" fill="#0d2135" stroke="#c8d0d8" stroke-opacity="0.28"/>
  <text x="86" y="568" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">TARGET ENVELOPE: 60 × 16 × 12 mm</text>
  <text x="423" y="568" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">TARGET MATERIAL: PETG</text>
  <text x="710" y="568" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">STATUS: CONCEPT</text>
  <text x="86" y="597" fill="#aebbc7" font-family="Arial, Helvetica, sans-serif" font-size="14">Planning targets from the internal product roadmap. Final geometry, dimensions, fit, and manufacturing details remain subject to CAD modeling and prototype validation.</text>
</svg>
